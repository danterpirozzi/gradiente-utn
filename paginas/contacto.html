<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumate — Gradiente UTN</title>
  <meta name="description" content="Sumate a Gradiente, el Centro de Estudiantes de la UTN Facultad Regional Rosario. Dejanos tus datos y te contactamos.">
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <header>
    <a href="../index.html" class="logo">
      <img src="../img/logo.png" alt="Gradiente">
    </a>
    <button class="menu-toggle" aria-label="Abrir menú">☰</button>
    <nav>
      <a href="../index.html">Inicio</a>
      <a href="novedades.html">Novedades</a>
      <a href="apuntec.html">APUNTEC</a>
      <a href="info-importante.html">Info importante</a>
      <a href="espacios-ceutn.html">Espacios CEUTN</a>
      <a href="links.html">Links</a>
      <a href="faq.html">FAQ</a>
      <a href="contacto.html" class="activo">Sumate</a>
    </nav>
  </header>

  <main>
    <h1>Sumate a Gradiente</h1>
    <p>Dejanos tus datos y nos ponemos en contacto.</p>

    <div style="display: flex; gap: 2.5rem; flex-wrap: wrap; margin-top: 1.5rem; align-items: flex-start;">

      <div id="carrusel-fotos" style="width: 100%; max-width: 340px; position: relative;">
        <img id="carrusel-imagen" src="../img/equipo.jpg" alt="Equipo de Gradiente"
             style="width: 100%; height: 320px; border-radius: var(--radio); border: 1px solid var(--borde); object-fit: cover; display: block;">

        <button id="carrusel-anterior" type="button" class="carrusel-flecha" aria-label="Foto anterior"
                style="position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%);">‹</button>
        <button id="carrusel-siguiente" type="button" class="carrusel-flecha" aria-label="Foto siguiente"
                style="position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);">›</button>

        <p id="carrusel-indicador" style="text-align: center; margin-top: 0.5rem; font-size: 0.8rem; color: var(--texto-mutado);"></p>
      </div>

      <form id="form-contacto" style="flex: 1; min-width: 280px; max-width: 500px; display: flex; flex-direction: column; gap: 1rem;">
        <label>
          Nombre completo
          <input type="text" name="nombre" required
                 style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--borde);">
        </label>

        <label>
          Email
          <input type="email" name="email" required
                 style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--borde);">
        </label>

        <label>
          Número de celular
          <input type="tel" name="telefono" placeholder="Ej: 341 1234567"
                 style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--borde);">
        </label>

        <label>
          Carrera
          <input type="text" name="carrera"
                 style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--borde);">
        </label>

        <label>
          Mensaje (opcional)
          <textarea name="mensaje" rows="4"
                    style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--borde);"></textarea>
        </label>

        <button type="submit"
                style="padding: 0.8rem; border: none; border-radius: 8px; background: var(--celeste); color: var(--azul-oscuro); font-weight: 700; cursor: pointer;">
          Enviar
        </button>

        <p id="mensaje-estado" style="font-weight: 600;"></p>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2026 Gradiente — Centro de Estudiantes UTN FRRo
  <p id="footer-redes" style="margin-top: 0.5rem; font-size: 0.8rem;"></p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/footer-redes.js"></script>
  <script src="../js/contacto.js"></script>
  <script src="../js/carrusel.js"></script>
</body>
</html>
